name: Update Issue Ratio Badge

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate ratio and update badge
        uses: actions/github-script@v7
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        with:
          script: |
            const gistId = process.env.GIST_ID;
            const gistToken = process.env.GIST_TOKEN;

            if (!gistId) {
              core.setFailed('GIST_ID secret is not set');
              return;
            }
            if (!gistToken) {
              core.setFailed('GIST_TOKEN secret is not set');
              return;
            }

            // Use default github token for reading issues
            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open`
            });
            const closed = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:issue state:closed`
            });

            const openCount = open.data.total_count;
            const closedCount = closed.data.total_count;
            const total = openCount + closedCount;
            const ratio = total > 0 ? ((closedCount / total) * 100).toFixed(1) : 0;

            core.info(`Open: ${openCount}, Closed: ${closedCount}, Ratio: ${ratio}%`);

            const badgeData = JSON.stringify({
              schemaVersion: 1,
              label: 'issues closed',
              message: `${ratio}% (${closedCount}/${total})`,
              color: ratio > 80 ? 'brightgreen' : ratio > 50 ? 'yellow' : 'red'
            });

            // Use a separate fetch call with the PAT for gist update
            const response = await fetch(`https://api.github.com/gists/${gistId}`, {
              method: 'PATCH',
              headers: {
                'Authorization': `token ${gistToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                files: {
                  'badges.json': {
                    content: badgeData
                  }
                }
              })
            });

            if (!response.ok) {
              const error = await response.json();
              core.setFailed(`Failed to update gist: ${response.status} - ${error.message}`);
              return;
            }

            core.info('Badge updated successfully');
