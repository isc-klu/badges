name: Update Issue Ratio Badge

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token availability
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "GIST_ID length: ${#GIST_ID}"
          echo "GIST_TOKEN length: ${#GIST_TOKEN}"

          if [ -z "$GIST_TOKEN" ]; then
            echo "::error::GIST_TOKEN is empty!"
            exit 1
          fi

          if [ -z "$GIST_ID" ]; then
            echo "::error::GIST_ID is empty!"
            exit 1
          fi

      - name: Calculate ratio and update gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          OPEN=$(curl -s -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/search/issues?q=repo:${REPO}+type:issue+state:open" \
            | jq '.total_count')

          CLOSED=$(curl -s -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/search/issues?q=repo:${REPO}+type:issue+state:closed" \
            | jq '.total_count')

          TOTAL=$((OPEN + CLOSED))

          if [ "$TOTAL" -gt 0 ]; then
            RATIO=$(echo "scale=1; $CLOSED * 100 / $TOTAL" | bc)
          else
            RATIO="0"
          fi

          echo "Open: $OPEN, Closed: $CLOSED, Total: $TOTAL, Ratio: $RATIO%"

          # Determine color
          RATIO_INT=${RATIO%.*}
          if [ "$RATIO_INT" -gt 80 ]; then
            COLOR="brightgreen"
          elif [ "$RATIO_INT" -gt 50 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # Create badge JSON
          BADGE_JSON=$(jq -n \
            --argjson schema 1 \
            --arg label "issues closed" \
            --arg message "${RATIO}% (${CLOSED}/${TOTAL})" \
            --arg color "$COLOR" \
            '{schemaVersion: $schema, label: $label, message: $message, color: $color}')

          echo "Badge JSON: $BADGE_JSON"

          # Update gist and capture response
          HTTP_CODE=$(curl -s -o /tmp/gist_response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "$(jq -n --arg content "$BADGE_JSON" '{files: {"badges.json": {content: $content}}}')")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to update gist (HTTP $HTTP_CODE)"
            cat /tmp/gist_response.json
            exit 1
          fi

          echo "✅ Badge updated successfully!"
