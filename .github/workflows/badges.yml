name: Update Issue Ratio Badge

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate ratio and update badge
        uses: actions/github-script@v7
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const gistId = process.env.GIST_ID;

            if (!gistId) {
              core.setFailed('GIST_ID secret is not set or is empty');
              return;
            }

            core.info(`Using Gist ID: ${gistId}`);

            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open`
            });
            const closed = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:issue state:closed`
            });

            const openCount = open.data.total_count;
            const closedCount = closed.data.total_count;
            const total = openCount + closedCount;
            const ratio = total > 0 ? ((closedCount / total) * 100).toFixed(1) : 0;

            core.info(`Open: ${openCount}, Closed: ${closedCount}, Ratio: ${ratio}%`);

            const badgeData = JSON.stringify({
              schemaVersion: 1,
              label: 'issues closed',
              message: `${ratio}% (${closedCount}/${total})`,
              color: ratio > 80 ? 'brightgreen' : ratio > 50 ? 'yellow' : 'red'
            });

            await github.rest.gists.update({
              gist_id: gistId,
              files: {
                'badges.json': {
                  content: badgeData
                }
              }
            });

            core.info('Badge updated successfully');
